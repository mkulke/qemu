name: Test

on:
  push:
    branches:
    - mkulke/ci
  pull_request:
    branches:
    - mkulke/ci

jobs:
  build:
    runs-on:
    - "mshv"
    - "l1vh"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure
        run: |
          mkdir -p install
          ./configure \
            --target-list=x86_64-softmmu \
            --disable-xen \
            --disable-vnc-jpeg \
            --enable-mshv \
            --disable-gtk \
            --prefix="${PWD}/install"

      - name: Cache build directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build
          key: qemu-build-${{ github.sha }}
          restore-keys: qemu-build-

      - name: Build and install
        run: |
          cd build
          make -j
          make install

      - name: Tar files
        run: tar -cvf qemu_install.tar install

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: qemu_install.tar

  mshv-l1vh:
    name: mshv/l1vh
    needs: build
    permissions: {}
    runs-on:
    - "mshv"
    - "l1vh"
    - "ovmf-fix"
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu_install.tar

      - name: Untar files
        run: tar -xf qemu_install.tar

      - name: Run functional tests
        uses: mkulke/qemu-test@da42dbfa0267307732f493f945678bd68290489f
        with:
          qemu_bin: ${{ github.workspace }}/install/bin/qemu-system-x86_64
          accel: mshv
          test_jobs: 8

  mshv-nested:
    name: mshv/nested
    needs: build
    permissions: {}
    runs-on:
    - "mshv"
    - "v5"
    - "ovmf-fix"
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu_install.tar

      - name: Untar files
        run: tar -xf qemu_install.tar

      - name: Run functional tests
        uses: mkulke/qemu-test@da42dbfa0267307732f493f945678bd68290489f
        with:
          qemu_bin: ${{ github.workspace }}/install/bin/qemu-system-x86_64
          accel: mshv
          test_jobs: 1
