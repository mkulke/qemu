name: Test

on:
  push:
    branches:
    - mkulke/migration

jobs:
  build:
    runs-on:
    - "mshv"
    - "6.6.116"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir -p install
          ./configure \
            --target-list=x86_64-softmmu \
            --disable-xen \
            --disable-vnc-jpeg \
            --enable-mshv \
            --disable-gtk \
            --prefix="${PWD}/install"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: qemu-build-${{ github.sha }}
          restore-keys: qemu-build-

      - name: Build and install
        run: |
          cd build
          make -j
          make install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build
          path: |
            non-existing-file-to-keep-directory-structure.😑
            install

  test:
    if: false
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    env:
      UBUNTU_URL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
      FEDORA_URL: https://download.fedoraproject.org/pub/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-UEFI-UKI-42-1.1.x86_64.qcow2
      IMAGE_DIR: /tmp/images
    strategy:
      matrix:
        cpu_model:
        - host
        - ""
        firmware:
        - seabios
        # - ovmf
        memory:
        - 2048M
        # - 4096M
        cpus:
        # - 1
        - 2
        distribution:
        - ubuntu
        # - fedora
        machine:
        - q35
        - pc
        iothreads:
        - enabled
        - disabled
        exclude:
        - cpus: 1
          iothreads: enabled
        - firmware: seabios
          distribution: fedora
        - firmware: ovmf
          machine: pc

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download OS image
        env:
          OS_URL: ${{ matrix.distribution == 'ubuntu' && env.UBUNTU_URL || env.FEDORA_URL }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          mkdir -p "$IMAGE_DIR"
          cd "$IMAGE_DIR"
          wget -N "$OS_URL"
          ln -sf "$PWD/$(basename "$OS_URL")" "${IMAGE_DIR}/${DISTRIBUTION}.qcow2"

      - name: Create SSH keypair
        run: ssh-keygen -t rsa -b 4096 -f qemu_ssh -N ""

      - name: Create cloud-init ISO
        run: |
          mkdir -p cidata
          cd cidata
          cat <<EOF> user-data
          #cloud-config
          users:
          - name: cloud
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            ssh-authorized-keys:
            - $(ssh-keygen -y -f ../qemu_ssh)
          EOF
          cat <<EOF> network-config
          version: 2
          ethernets:
            eth0:
              match:
                macaddress: 00:10:20:30:40:50
              dhcp4: true
          EOF
          cat <<EOF> meta-data
          instance-id: qemu-ci
          local-hostname: qemu-ci
          EOF
          genisoimage -output "${IMAGE_DIR}/cidata.raw" -volid cidata -joliet -rock \
            user-data \
            meta-data \
            network-config
          cd ..
          echo "CI_IMG=${IMAGE_DIR}/cidata.raw" >> "$GITHUB_ENV"

      - name: Launch QEMU
        env:
          PID_FILE: qemu-${{matrix.firmware}}.pid
          QEMU_BIN: install/bin/qemu-system-x86_64
          CPUS: ${{ matrix.cpus }}
          MEMORY: ${{ matrix.memory }}
          FIRMWARE: ${{ matrix.firmware }}
          DISK_IMG: ${{ env.IMAGE_DIR }}/${{ matrix.distribution }}.qcow2
          MACHINE: ${{ matrix.machine }}
          IOTHREADS: ${{ matrix.iothreads == 'enabled' && 'io0' || '' }}
          OS_URL: ${{ matrix.distribution == 'ubuntu' && env.UBUNTU_URL || env.FEDORA_URL }}
          CPU_MODEL: ${{ matrix.cpu_model }}
        run: |
          chmod +x "$QEMU_BIN"
          cmd=("$QEMU_BIN"
               -machine   "$MACHINE"
               -drive     "file=$DISK_IMG,format=qcow2,if=none,id=osdisk,snapshot=on"
               -device    "virtio-blk-pci,drive=osdisk${IOTHREADS:+,iothread=$IOTHREADS}"
               -drive     "file=$CI_IMG,format=raw,if=none,id=cidata"
               -device    "virtio-blk-pci,drive=cidata"
               -m         "$MEMORY"
               -netdev    "type=user,id=user-net,hostfwd=tcp::2222-:22"
               -device    "virtio-net,mac=00:10:20:30:40:50,netdev=user-net"
               -accel      mshv
               -smp       "cpus=$CPUS"
               -serial    "file:serial.log"
               -rtc       "clock=vm"
               -daemonize
               -pidfile   "$PID_FILE")
          if [[ -n "$CPU_MODEL" ]]; then
            cmd+=(-cpu   "$CPU_MODEL")
          fi
          if [[ -n "$IOTHREADS" ]]; then
            cmd+=(-object   "iothread,id=${IOTHREADS}")
          fi
          if [[ "$FIRMWARE" == "ovmf" ]]; then
            cp /usr/share/OVMF/OVMF_VARS.fd .
            cmd+=(-drive  "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd"
                  -drive  "if=pflash,format=raw,file=OVMF_VARS.fd")
          fi
          exec "${cmd[@]}"

      - name: Sleep
        run: sleep 30

      - name: SSH into VM
        run: |
          ssh -p 2222 -i ./qemu_ssh \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            cloud@localhost whoami

      - name: Terminate QEMU
        if: always()
        env:
          PID_FILE: qemu-${{matrix.firmware}}.pid
        run: |
          kill -9 "$(cat "$PID_FILE")"
          timeout 5 tail --pid="$(cat "$PID_FILE")" -f /dev/null

  migration-bytecode:
    if: false
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        cpu_model:
        - ""
        - host
        roundtrip:
        - false
        - true
        exclude:
        # keep matrix manageable: only roundtrip with default cpu, smp=2
        - roundtrip: true
          smp: 1
        - roundtrip: true
          smp: 4
        - roundtrip: true
          cpu_model: host
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Run migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          cmd=(python3 tests/mshv/test_migration.py "$QEMU_BIN"
               --machine ${{ matrix.machine }}
               --smp ${{ matrix.smp }})
          if [[ -n "${{ matrix.cpu_model }}" ]]; then
            cmd+=(--cpu ${{ matrix.cpu_model }})
          fi
          if [[ "${{ matrix.roundtrip }}" == "true" ]]; then
            cmd+=(--roundtrip)
          fi
          "${cmd[@]}"

  migration-kernel:
    if: false
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-netboot-3.23.3-x86_64.tar.gz
      ALPINE_DIR: /tmp/images/alpine
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download Alpine kernel
        run: |
          mkdir -p "$ALPINE_DIR"
          TARBALL="$ALPINE_DIR/$(basename "$ALPINE_URL")"
          wget -N -P "$ALPINE_DIR" "$ALPINE_URL"
          tar xzf "$TARBALL" -C "$ALPINE_DIR"
          echo "KERNEL=$ALPINE_DIR/boot/vmlinuz-lts" >> "$GITHUB_ENV"

      - name: Build init and initrd
        run: |
          gcc -static -o /tmp/init tests/mshv/init.c
          tests/mshv/mk-initrd.sh /tmp/initrd.img /tmp/init
          echo "INITRD=/tmp/initrd.img" >> "$GITHUB_ENV"

      - name: Run direct boot migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          python3 tests/mshv/test_migration.py "$QEMU_BIN" \
            --machine ${{ matrix.machine }} \
            --smp ${{ matrix.smp }} \
            --kernel "$KERNEL" \
            --initrd "$INITRD"

  migration-ubuntu:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    env:
      UBUNTU_URL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
      IMAGE_DIR: /tmp/images
      GUEST_IP: 192.168.100.2
      BRIDGE_IP: 192.168.100.1
    strategy:
      matrix:
        machine:
        - q35
        - pc
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download Ubuntu image
        run: |
          mkdir -p "$IMAGE_DIR"
          wget -N -P "$IMAGE_DIR" "$UBUNTU_URL"
          echo "DISK_IMG=$IMAGE_DIR/$(basename "$UBUNTU_URL")" >> "$GITHUB_ENV"

      - name: Create SSH keypair
        run: ssh-keygen -t rsa -b 4096 -f qemu_ssh -N ""

      - name: Create cloud-init ISO
        run: |
          mkdir -p cidata
          cd cidata
          cat <<EOF> user-data
          #cloud-config
          users:
          - name: cloud
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            ssh-authorized-keys:
            - $(ssh-keygen -y -f ../qemu_ssh)
          EOF
          cat <<EOF> network-config
          version: 2
          ethernets:
            eth0:
              match:
                macaddress: 00:10:20:30:40:50
              addresses:
              - ${GUEST_IP}/24
              gateway4: ${BRIDGE_IP}
          EOF
          cat <<EOF> meta-data
          instance-id: qemu-ci
          local-hostname: qemu-ci
          EOF
          genisoimage -output "$IMAGE_DIR/cidata.raw" -volid cidata -joliet -rock \
            user-data meta-data network-config
          cd ..
          echo "CI_IMG=$IMAGE_DIR/cidata.raw" >> "$GITHUB_ENV"

      - name: Set up bridge and tap devices
        run: |
          sudo ip link add br0 type bridge
          sudo ip addr add ${BRIDGE_IP}/24 dev br0
          sudo ip link set br0 up
          for tap in tap0 tap1; do
            sudo ip tuntap add $tap mode tap user $(whoami)
            sudo ip link set $tap master br0
            sudo ip link set $tap up
          done

      - name: Run Ubuntu migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          python3 tests/mshv/test_migration_ubuntu.py "$QEMU_BIN" \
            --disk "$DISK_IMG" \
            --ci-img "$CI_IMG" \
            --ssh-key qemu_ssh \
            --guest-ip "$GUEST_IP" \
            --machine ${{ matrix.machine }}

      - name: Tear down network
        if: always()
        run: |
          for tap in tap0 tap1; do
            sudo ip link del $tap 2>/dev/null || true
          done
          sudo ip link del br0 2>/dev/null || true
