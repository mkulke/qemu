name: Test

on:
  push:
    branches:
    - mkulke/migration-ci

jobs:
  build:
    runs-on:
    - "mshv"
    - "6.6.116"
    - "self-hosted"
    - "l1vh"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir -p install
          ./configure \
            --target-list=x86_64-softmmu \
            --disable-xen \
            --disable-vnc-jpeg \
            --enable-mshv \
            --disable-gtk \
            --prefix="${PWD}/install"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: qemu-build-${{ github.sha }}
          restore-keys: qemu-build-

      - name: Build and install
        run: |
          cd build
          make -j
          make install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build
          path: |
            non-existing-file-to-keep-directory-structure.😑
            install

  migration:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    - "l1vh"
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        - 8
        cpu_model:
        - ""
        - host
        roundtrip:
        - false
        - true
        exclude:
        # keep matrix manageable: only roundtrip with default cpu, smp=2
        - roundtrip: true
          smp: 1
        - roundtrip: true
          smp: 4
        - roundtrip: true
          cpu_model: host
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Run migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          cmd=(python3 tests/mshv/test_migration.py "$QEMU_BIN"
               --machine ${{ matrix.machine }}
               --smp ${{ matrix.smp }})
          if [[ -n "${{ matrix.cpu_model }}" ]]; then
            cmd+=(--cpu ${{ matrix.cpu_model }})
          fi
          if [[ "${{ matrix.roundtrip }}" == "true" ]]; then
            cmd+=(--roundtrip)
          fi
          "${cmd[@]}"

  migration-kernel:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-netboot-3.23.3-x86_64.tar.gz
      ALPINE_DIR: /tmp/images/alpine
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        - 8
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download Alpine kernel
        run: |
          mkdir -p "$ALPINE_DIR"
          TARBALL="$ALPINE_DIR/$(basename "$ALPINE_URL")"
          wget -N -P "$ALPINE_DIR" "$ALPINE_URL"
          tar xzf "$TARBALL" -C "$ALPINE_DIR"
          echo "KERNEL=$ALPINE_DIR/boot/vmlinuz-lts" >> "$GITHUB_ENV"

      - name: Build init and initrd
        run: |
          gcc -static -o /tmp/init tests/mshv/init.c
          tests/mshv/mk-initrd.sh /tmp/initrd.img /tmp/init
          echo "INITRD=/tmp/initrd.img" >> "$GITHUB_ENV"

      - name: Run direct boot migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          python3 tests/mshv/test_migration.py "$QEMU_BIN" \
            --machine ${{ matrix.machine }} \
            --smp ${{ matrix.smp }} \
            --kernel "$KERNEL" \
            --initrd "$INITRD"
