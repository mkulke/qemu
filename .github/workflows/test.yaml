name: Test

on:
  push:
    branches:
    - mkulke/migration-ci

jobs:
  build:
    runs-on:
    - "mshv"
    - "6.6.116"
    - "self-hosted"
    - "l1vh"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir -p install
          ./configure \
            --target-list=x86_64-softmmu \
            --disable-xen \
            --disable-vnc-jpeg \
            --enable-mshv \
            --disable-gtk \
            --prefix="${PWD}/install"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: qemu-build-${{ github.sha }}
          restore-keys: qemu-build-

      - name: Build and install
        run: |
          cd build
          make -j
          make install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build
          path: |
            non-existing-file-to-keep-directory-structure.😑
            install

  migration:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    - "l1vh"
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        cpu_model:
        - ""
        - host
        roundtrip:
        - false
        - true
        exclude:
        # keep matrix manageable: only roundtrip with default cpu, smp=2
        - roundtrip: true
          smp: 1
        - roundtrip: true
          smp: 4
        - roundtrip: true
          cpu_model: host
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Run migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          cmd=(python3 tests/mshv/test_migration.py "$QEMU_BIN"
               --machine ${{ matrix.machine }}
               --smp ${{ matrix.smp }})
          if [[ -n "${{ matrix.cpu_model }}" ]]; then
            cmd+=(--cpu ${{ matrix.cpu_model }})
          fi
          if [[ "${{ matrix.roundtrip }}" == "true" ]]; then
            cmd+=(--roundtrip)
          fi
          "${cmd[@]}"

  migration-kernel:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    - "l1vh"
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-netboot-3.23.3-x86_64.tar.gz
      ALPINE_DIR: /tmp/images/alpine
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        - 8
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download Alpine kernel
        run: |
          mkdir -p "$ALPINE_DIR"
          TARBALL="$ALPINE_DIR/$(basename "$ALPINE_URL")"
          wget -N -P "$ALPINE_DIR" "$ALPINE_URL"
          tar xzf "$TARBALL" -C "$ALPINE_DIR"
          echo "KERNEL=$ALPINE_DIR/boot/vmlinuz-lts" >> "$GITHUB_ENV"

      - name: Build init and initrd
        run: |
          gcc -static -o /tmp/init tests/mshv/init.c
          tests/mshv/mk-initrd.sh /tmp/initrd.img /tmp/init
          echo "INITRD=/tmp/initrd.img" >> "$GITHUB_ENV"

      - name: Run direct boot migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
        run: |
          chmod +x "$QEMU_BIN"
          python3 tests/mshv/test_migration.py "$QEMU_BIN" \
            --machine ${{ matrix.machine }} \
            --smp ${{ matrix.smp }} \
            --kernel "$KERNEL" \
            --initrd "$INITRD"

  migration-fullos:
    needs: build
    runs-on:
    - "mshv"
    - "6.6.116"
    - "l1vh"
    env:
      UBUNTU_URL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
      IMAGE_DIR: /tmp/images
      GUEST_IP: 192.168.100.2
      BRIDGE_IP: 192.168.100.1
    strategy:
      matrix:
        machine:
        - q35
        - pc
        smp:
        - 1
        - 2
        - 4
        - 8
        stress:
        - false
        - true
        cpu:
        - ""
        - host
        avx2:
        - false
        - true
        exclude:
        # only stress with default cpu to keep matrix manageable
        - stress: true
          cpu: host
        # avx2 only makes sense with -cpu host
        - avx2: true
          cpu: ""
        # don't combine avx2 and stress
        - avx2: true
          stress: true
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-build
          path: .

      - name: Download Ubuntu image
        run: |
          mkdir -p "$IMAGE_DIR"
          wget -N -P "$IMAGE_DIR" "$UBUNTU_URL"
          echo "DISK_IMG=$IMAGE_DIR/$(basename "$UBUNTU_URL")" >> "$GITHUB_ENV"

      - name: Create SSH keypair
        run: ssh-keygen -t rsa -b 4096 -f qemu_ssh -N ""

      - name: Create cloud-init ISO
        run: |
          mkdir -p cidata
          cd cidata
          cat <<EOF> user-data
          #cloud-config
          users:
          - name: cloud
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            ssh-authorized-keys:
            - $(ssh-keygen -y -f ../qemu_ssh)
          EOF
          cat <<EOF> network-config
          version: 2
          ethernets:
            eth0:
              match:
                macaddress: 00:10:20:30:40:50
              addresses:
              - ${GUEST_IP}/24
              gateway4: ${BRIDGE_IP}
              nameservers:
                addresses:
                - 8.8.8.8
          EOF
          cat <<EOF> meta-data
          instance-id: qemu-ci
          local-hostname: qemu-ci
          EOF
          genisoimage -output "$IMAGE_DIR/cidata.raw" -volid cidata -joliet -rock \
            user-data meta-data network-config
          cd ..
          echo "CI_IMG=$IMAGE_DIR/cidata.raw" >> "$GITHUB_ENV"

      - name: Set up bridge and tap devices
        run: |
          sudo ip link add br0 type bridge
          sudo ip addr add "${BRIDGE_IP}/24" dev br0
          sudo ip link set br0 up
          for tap in tap0 tap1; do
            sudo ip tuntap add $tap mode tap user "$(whoami)"
            sudo ip link set $tap master br0
            sudo ip link set $tap up
          done
          # NAT so the guest can reach the internet
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s "${BRIDGE_IP%.*}.0/24" ! -o br0 -j MASQUERADE
          sudo iptables -A FORWARD -i br0 -j ACCEPT
          sudo iptables -A FORWARD -o br0 -m state --state RELATED,ESTABLISHED -j ACCEPT

      - name: Build AVX2 test
        if: matrix.avx2
        run: gcc -mavx2 -o tests/mshv/test-avx2 tests/mshv/test-avx2.c

      - name: Run Ubuntu migration test
        env:
          QEMU_BIN: install/bin/qemu-system-x86_64
          CPU: ${{ matrix.cpu }}
          STRESS: ${{ matrix.stress == true && '--stress' || '' }}
          AVX2: ${{ matrix.avx2 == true && '--avx2' || '' }}
          SMP: ${{ matrix.smp }}
        run: |
          chmod +x "$QEMU_BIN"
          python3 tests/mshv/test_migration_ubuntu.py "$QEMU_BIN" \
            --disk "$DISK_IMG" \
            --ci-img "$CI_IMG" \
            --ssh-key qemu_ssh \
            --guest-ip "$GUEST_IP" \
            --machine ${{ matrix.machine }} \
            --smp "$SMP" \
            ${CPU:+--cpu "$CPU"} \
            ${STRESS} \
            ${AVX2}


      - name: Tear down network
        if: always()
        run: |
          sudo iptables -t nat -D POSTROUTING -s "${BRIDGE_IP%.*}.0/24" ! -o br0 -j MASQUERADE 2>/dev/null || true
          sudo iptables -D FORWARD -i br0 -j ACCEPT 2>/dev/null || true
          sudo iptables -D FORWARD -o br0 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
          for tap in tap0 tap1; do
            sudo ip link del $tap 2>/dev/null || true
          done
          sudo ip link del br0 2>/dev/null || true
